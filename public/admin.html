<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel Administrativo</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eef4f8;
            margin: 0;
            padding: 30px;
            color: #1f2d3d;
        }

        header {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #014f86;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            background: #014f86;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #2a6f97;
        }

        #cardapio {
            max-width: 1000px;
            margin: 30px auto;
        }

        .dia {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,.08);
        }

        .dia h2 {
            color: #014f86;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccd6df;
            border-radius: 8px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .salvar {
            margin-top: 25px;
            width: 100%;
            background: #2a6f97;
        }

        #mensagem {
            text-align: center;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <header>

        <h1>
            Painel do Cardápio
        </h1>

        <button id="logout">
            Sair
        </button>

    </header>


    <main id="cardapio">

        Carregando cardápio...

    </main>


    <script>

        let menu = [];


        async function carregarMenu() {

            const resposta =
                await fetch("/api/menu");

            menu =
                await resposta.json();

            mostrarMenu();

        }


        function mostrarMenu() {

            const container =
                document.getElementById("cardapio");

            container.innerHTML = "";


            menu.forEach((item, index) => {

                const div =
                    document.createElement("div");

                div.className = "dia";


                div.innerHTML = `

                    <h2>${item.dia}</h2>

                    <label>
                        Prato
                    </label>

                    <input
                        id="titulo-${index}"
                        value="${item.titulo}"
                    >

                    <label>
                        Descrição
                    </label>

                    <textarea
                        id="descricao-${index}"
                    >${item.descricao}</textarea>

                    <label>
                        Calorias
                    </label>

                    <input
                        id="calorias-${index}"
                        value="${item.calorias}"
                    >

                    <label>
                        Proteínas
                    </label>

                    <input
                        id="proteinas-${index}"
                        value="${item.proteinas}"
                    >

                    <label>
                        Carboidratos
                    </label>

                    <input
                        id="carboidratos-${index}"
                        value="${item.carboidratos}"
                    >

                    <label>
                        Alerta
                    </label>

                    <textarea
                        id="alerta-${index}"
                    >${item.alerta}</textarea>

                    <button
                        class="salvar"
                        onclick="salvarDia(${index})"
                    >
                        Salvar ${item.dia}
                    </button>

                `;

                container.appendChild(div);

            });

        }


        async function salvarDia(index) {

            menu[index].titulo =
                document.getElementById(
                    `titulo-${index}`
                ).value;


            menu[index].descricao =
                document.getElementById(
                    `descricao-${index}`
                ).value;


            menu[index].calorias =
                document.getElementById(
                    `calorias-${index}`
                ).value;


            menu[index].proteinas =
                document.getElementById(
                    `proteinas-${index}`
                ).value;


            menu[index].carboidratos =
                document.getElementById(
                    `carboidratos-${index}`
                ).value;


            menu[index].alerta =
                document.getElementById(
                    `alerta-${index}`
                ).value;


            const resposta =
                await fetch("/api/admin/menu", {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(menu)

                });


            const dados =
                await resposta.json();


            document.getElementById(
                "mensagem"
            ).textContent =
                dados.mensagem;

        }


        document
            .getElementById("logout")
            .addEventListener(
                "click",
                async () => {

                    await fetch(
                        "/api/logout",
                        {
                            method: "POST"
                        }
                    );

                    window.location.href =
                        "/login.html";

                }
            );


        carregarMenu();

    </script>


    <p id="mensagem"></p>

</body>

</html>
