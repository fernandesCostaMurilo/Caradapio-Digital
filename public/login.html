<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="container">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                name="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p id="mensagem"></p>

        <p class="link">

            Não tem conta?

            <a href="cadastro.html">
                Cadastrar
            </a>

        </p>

        <button
            type="button"
            class="btn-voltar"
            onclick="window.location.href='index.html'"
        >
            Voltar
        </button>

    </div>


    <script>

        const formulario =
            document.getElementById("loginForm");

        const mensagem =
            document.getElementById("mensagem");


        formulario.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value;

                const senha =
                    document.getElementById("senha").value;


                try {

                    const resposta =
                        await fetch("/api/login", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                senha: senha
                            })

                        });


                    const dados =
                        await resposta.json();


                    mensagem.textContent =
                        dados.mensagem;


                    if (dados.sucesso) {

                        window.location.href =
                            "/admin";

                    }

                } catch (erro) {

                    mensagem.textContent =
                        "Não foi possível conectar ao servidor.";

                    console.error(erro);

                }

            }
        );

    </script>

</body>

</html>
