<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cardápio Escolar Nutritivo</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =====================================================
         BARRA LATERAL
    ====================================================== -->

    <aside class="barra-lateral">

        <div class="logo-sidebar">
            Menu Escolar
        </div>


        <nav class="links-sidebar">

            <a
                href="duvidas.html"
                class="item-sidebar"
            >
                ❓ Dúvidas Frequentes
            </a>


            <a
                href="#contato"
                class="item-sidebar"
            >
                💬 Fale Conosco
            </a>


            <a
                href="#nutricionista"
                class="item-sidebar"
            >
                🍎 Falar com Nutricionista
            </a>

        </nav>


        <div class="rodape-sidebar">

            <a
                href="login.html"
                class="botao-login"
            >
                👤 Entrar / Login
            </a>

        </div>

    </aside>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="conteudo-principal">

        <header>

            <h1>
                Cardápio Escolar Nutritivo
            </h1>

            <p>
                Alimentação balanceada, segura e energia
                para o seu dia de estudos!
            </p>

        </header>


        <!-- =================================================
             CONTROLE DAS ABAS
        ================================================== -->

        <input
            type="radio"
            id="tab-seg"
            name="semana-control"
            checked
        >

        <input
            type="radio"
            id="tab-ter"
            name="semana-control"
        >

        <input
            type="radio"
            id="tab-qua"
            name="semana-control"
        >

        <input
            type="radio"
            id="tab-qui"
            name="semana-control"
        >

        <input
            type="radio"
            id="tab-sex"
            name="semana-control"
        >


        <!-- =================================================
             ABAS DOS DIAS
        ================================================== -->

        <nav class="abas-semana">

            <label
                for="tab-seg"
                class="aba-dia"
            >
                Segunda
            </label>


            <label
                for="tab-ter"
                class="aba-dia"
            >
                Terça
            </label>


            <label
                for="tab-qua"
                class="aba-dia"
            >
                Quarta
            </label>


            <label
                for="tab-qui"
                class="aba-dia"
            >
                Quinta
            </label>


            <label
                for="tab-sex"
                class="aba-dia"
            >
                Sexta
            </label>

        </nav>


        <!-- =================================================
             CARDÁPIO DINÂMICO

             O JavaScript vai buscar os dados no servidor
             através de /api/menu e colocar os pratos aqui.
        ================================================== -->

        <div id="cardapio-dinamico">

            <div class="carregando-cardapio">

                Carregando cardápio...

            </div>

        </div>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /*
         * ==================================================
         * CONFIGURAÇÃO
         * ==================================================
         */

        const containerCardapio =
            document.getElementById(
                "cardapio-dinamico"
            );


        /*
         * ==================================================
         * BUSCAR CARDÁPIO NO SERVIDOR
         * ==================================================
         */

        async function carregarCardapio() {

            try {

                const resposta =
                    await fetch("/api/menu");


                if (!resposta.ok) {

                    throw new Error(
                        "Não foi possível buscar o cardápio."
                    );

                }


                const menu =
                    await resposta.json();


                console.log(
                    "Cardápio recebido do servidor:",
                    menu
                );


                mostrarCardapio(menu);


            } catch (erro) {

                console.error(
                    "Erro ao carregar cardápio:",
                    erro
                );


                containerCardapio.innerHTML = `

                    <div class="erro-cardapio">

                        <h2>
                            ⚠️ Erro ao carregar o cardápio
                        </h2>

                        <p>
                            Não foi possível conectar
                            ao servidor.
                        </p>

                    </div>

                `;

            }

        }


        /*
         * ==================================================
         * CRIAR OS CARDS
         * ==================================================
         */

        function mostrarCardapio(menu) {

            containerCardapio.innerHTML = "";


            /*
             * Verificar se existe cardápio
             */

            if (
                !Array.isArray(menu) ||
                menu.length === 0
            ) {

                containerCardapio.innerHTML = `

                    <div class="erro-cardapio">

                        <h2>
                            Cardápio vazio
                        </h2>

                        <p>
                            Nenhum item foi cadastrado.
                        </p>

                    </div>

                `;

                return;

            }


            /*
             * Criar cada dia
             */

            menu.forEach((item, index) => {


                const painel =
                    document.createElement("div");


                painel.className =
                    "painel-cardapio";


                painel.dataset.index =
                    index;


                /*
                 * ==========================================
                 * CARD DO PRATO
                 * ==========================================
                 */

                painel.innerHTML = `

                    <div class="topo-painel">

                        <h2>
                            Almoço Escolar
                        </h2>


                        <span class="tag-dia">
                            ${escaparHTML(item.dia)}
                        </span>

                    </div>


                    <div class="alerta-alergicos">

                        <strong>
                            ⚠️ Alerta para Alérgicos:
                        </strong>

                        ${escaparHTML(item.alerta)}

                    </div>


                    <div class="grid-itens">

                        <div class="card-prato">


                            <div
                                class="imagem-prato"
                                style="background-color: #2a6f97;"
                            >
                                [ Almoço ]
                            </div>


                            <div class="info-prato">


                                <h3>
                                    ${escaparHTML(item.titulo)}
                                </h3>


                                <p>
                                    ${escaparHTML(item.descricao)}
                                </p>


                                <div class="macro-container">


                                    <div class="macro-box">

                                        <span class="label">
                                            Calorias
                                        </span>

                                        <span class="valor">
                                            ${escaparHTML(item.calorias)}
                                        </span>

                                    </div>


                                    <div class="macro-box">

                                        <span class="label">
                                            Proteínas
                                        </span>

                                        <span class="valor">
                                            ${escaparHTML(item.proteinas)}
                                        </span>

                                    </div>


                                    <div class="macro-box">

                                        <span class="label">
                                            Carbos
                                        </span>

                                        <span class="valor">
                                            ${escaparHTML(item.carboidratos)}
                                        </span>

                                    </div>


                                </div>

                            </div>

                        </div>

                    </div>

                `;


                containerCardapio.appendChild(
                    painel
                );

            });


            /*
             * Depois que os cards foram criados,
             * configuramos as abas.
             */

            configurarAbas();

        }


        /*
         * ==================================================
         * SISTEMA DE ABAS
         * ==================================================
         */

        function configurarAbas() {


            const radios =
                document.querySelectorAll(
                    'input[name="semana-control"]'
                );


            const paineis =
                document.querySelectorAll(
                    ".painel-cardapio"
                );


            function atualizarPainel() {


                let selecionado = 0;


                radios.forEach(
                    (radio, index) => {

                        if (radio.checked) {

                            selecionado =
                                index;

                        }

                    }
                );


                paineis.forEach(
                    (painel, index) => {

                        if (
                            index ===
                            selecionado
                        ) {

                            painel.style.display =
                                "block";

                        } else {

                            painel.style.display =
                                "none";

                        }

                    }
                );

            }


            radios.forEach(
                radio => {

                    radio.addEventListener(
                        "change",
                        atualizarPainel
                    );

                }
            );


            atualizarPainel();

        }


        /*
         * ==================================================
         * SEGURANÇA
         *
         * Evita que textos vindos do JSON sejam
         * interpretados como HTML.
         * ==================================================
         */

        function escaparHTML(valor) {

            if (valor === null ||
                valor === undefined) {

                return "";

            }


            return String(valor)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /*
         * ==================================================
         * INICIAR
         * ==================================================
         */

        carregarCardapio();

    </script>

</body>

</html>
